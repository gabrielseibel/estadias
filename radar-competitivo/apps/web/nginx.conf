server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # A interface é uma SPA: qualquer rota desconhecida devolve o index.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # A API roda em outro container; o nginx encaminha para ela.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A coleta pode demorar; a requisição que a enfileira não, mas o
    # acompanhamento de progresso faz chamadas frequentes.
    proxy_read_timeout 120s;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
