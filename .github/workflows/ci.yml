name: CI — Radar Competitivo

on:
  # O push é restrito ao branch padrão de propósito: em um branch com pull
  # request aberto, os dois gatilhos disparariam execuções idênticas do mesmo
  # commit. O evento pull_request já cobre os branches de trabalho.
  push:
    branches: [master, main]
    paths: ['radar-competitivo/**', '.github/workflows/ci.yml']
  pull_request:
    paths: ['radar-competitivo/**', '.github/workflows/ci.yml']

# Um push novo cancela a execução anterior do mesmo branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: radar-competitivo

jobs:
  verificar:
    name: Typecheck, build e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # O projeto usa recursos exclusivos do PostgreSQL (arrays escalares,
    # FOR UPDATE SKIP LOCKED, busca case-insensitive), então a suíte roda
    # contra um Postgres real — não contra um substituto.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: radar_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U radar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://radar:radar@localhost:5432/radar_test?schema=public
      JWT_SECRET: segredo-de-ci-com-mais-de-32-caracteres-aqui
      NODE_ENV: test
      # O crawler é exercitado contra um servidor HTTP local de fixtures; sem
      # isto o guarda SSRF bloquearia 127.0.0.1, como faz em produção.
      CRAWLER_ALLOW_PRIVATE_HOSTS: 'false'
      CRAWLER_DOMAIN_DELAY_MS: '0'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: radar-competitivo/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar cliente Prisma
        run: npm run db:generate --workspace=apps/api

      - name: Aplicar migrations no banco de teste
        run: npm run db:deploy --workspace=apps/api

      - name: Typecheck (API)
        run: npm run typecheck --workspace=apps/api

      - name: Typecheck (interface)
        run: npm run typecheck --workspace=apps/web

      - name: Testes da API
        run: npm test --workspace=apps/api

      - name: Testes da interface
        run: npm test --workspace=apps/web

      - name: Build
        run: npm run build

  # Um deploy quebrou porque o ambiente de produção instala dependências de
  # forma diferente do CI: com NODE_ENV=production o npm pula as
  # devDependencies, e typescript, @types/node e a CLI do Prisma estão lá.
  # Este job executa o comando de build declarado no render.yaml, lido do
  # próprio arquivo, para que CI e deploy não possam divergir em silêncio.
  build-de-producao:
    name: Build de produção (comando do render.yaml)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extrair os comandos de build do blueprint
        id: blueprint
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          # O job roda em radar-competitivo/ (defaults do workflow); o
          # blueprint fica na raiz, que é onde a Render o procura.
          blueprint = yaml.safe_load(open('../render.yaml'))
          for service in blueprint['services']:
              print(f"{service['name'].replace('-', '_')}={service['buildCommand']}")
          PY

      - name: Build da API como em produção
        run: ${{ steps.blueprint.outputs.radar_api }}

      - name: Build da interface como em produção
        run: ${{ steps.blueprint.outputs.radar_web }}

      - name: Confirmar os artefatos que os serviços executam
        run: |
          test -f apps/api/dist/src/main.js
          test -f apps/api/dist/src/worker-main.js
          test -f apps/web/dist/index.html
